<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Studio di architettura</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- Header: logo e menu, sotto i 768px i link si nascondono nel bottone con le tre righe -->
    <header>
      <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">

          <a class="navbar-brand fw-bold" href="#">Atelier</a>

          <button class="navbar-toggler" type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#menu"
                  aria-controls="menu" aria-expanded="false"
                  aria-label="Apri menu">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#studio">Studio</a></li>
              <li class="nav-item"><a class="nav-link" href="#servizi">Servizi</a></li>
              <li class="nav-item"><a class="nav-link" href="#contatti">Contatti</a></li>
            </ul>
          </div>

        </div>
      </nav>
    </header>

    <!-- Il bannerone marrone col contenuto al centro -->
    <section id="studio" class="bg-primary text-white d-flex align-items-center justify-content-center text-center">
      <div class="container">
        <h1 class="fw-bold mb-3">Architettura per spazi che parlano</h1>
        <p class="fs-5 mb-4">Progettiamo case, uffici e spazi commerciali con attenzione alla luce, ai materiali e al contesto.</p>
        <!-- Porta giù al form -->
        <a href="#contatti" class="btn btn-primary btn-lg">Inizia un progetto</a>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
